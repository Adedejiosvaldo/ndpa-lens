packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  "@swc/core": true
  # Optional native add-ons pulled in by testcontainers (SSH docker hosts); not needed.
  cpu-features: false
  ssh2: false
  protobufjs: false
  # Install-time telemetry from swagger-ui-dist; never run it.
  "@scarf/scarf": false
