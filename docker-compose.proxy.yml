# Use this when the server already runs a reverse proxy (e.g. another Caddy
# or Nginx container) on ports 80/443. It joins that proxy's Docker network so
# the proxy can reach the app at http://ndpa-lens:3000.
#
# Turn it on in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
#   PROXY_NETWORK=<the proxy's network name>
# Find the network name with:
#   docker inspect <proxy-container> --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
services:
  ndpa-lens:
    networks:
      default:
      proxy:
        aliases: [ndpa-lens]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in .env to your proxy's Docker network}
